name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Check extension script syntax
        run: |
          node --check background-wrapper.js
          node --check background.js
          node --check action-icon.js
          node --check contract.js
          node --check providers.js
          node --check dom-contract.js
          node --check dom-probes.js
          node --check popup.js

      - name: Run tests
        run: npm test
